services:
  sabik:
    build: .
    devices:
      # Stable across host renumbering; find yours with: ls /dev/serial/by-id/
      - "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AB8M4JG7-if00-port0:/dev/ttyUSB0"
    environment:
      - SERIAL_DEVICE=/dev/ttyUSB0
      - MQTT_HOST=localhost # Adjust these as needed
      - MQTT_PORT=1883
      - MQTT_USERNAME=mqtt
      - MQTT_PASSWORD=password
    restart: unless-stopped
    networks:
      - mqtt-net

networks:
  mqtt-net:
    driver: bridge
